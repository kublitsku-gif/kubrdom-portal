name: Check Avito delivery

on:
  workflow_dispatch:
    inputs:
      repair_webhook:
        description: Restore the portal webhook subscription
        type: boolean
        default: false
      chat_id:
        description: Import this Avito chat into CRM and Telegram without replying
        type: string
        default: ''
      prepare_draft:
        description: Prepare an AI draft without sending it to the customer
        type: boolean
        default: false
      draft_mode:
        description: Enable AI draft preparation and disable automatic customer replies
        type: boolean
        default: false
      rewrite_hint:
        description: Optional instruction to refine the prepared draft
        type: string
        default: ''
      probe_pdf:
        description: Validate file-message support using a nonexistent recipient and no file
        type: boolean
        default: false
      diagnose_name:
        description: Read-only delivery diagnosis for a matching CRM chat name
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/avito-maintenance.mjs
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPAIR_WEBHOOK: ${{ inputs.repair_webhook }}
          IMPORT_CHAT_ID: ${{ inputs.chat_id }}
          PREPARE_DRAFT: ${{ inputs.prepare_draft }}
          DRAFT_MODE: ${{ inputs.draft_mode }}
          REWRITE_HINT: ${{ inputs.rewrite_hint }}
          PROBE_PDF: ${{ inputs.probe_pdf }}
          DIAGNOSE_NAME: ${{ inputs.diagnose_name }}
